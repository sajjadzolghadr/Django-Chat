<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chat Rooms</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:#0d0e12;font-family:system-ui,sans-serif;padding:40px 30px}
.container{max-width:500px;width:100%}
.title{color:#ede8df;font-size:26px;margin-bottom:10px}.title span{color:#dbbd94}
.line{width:60px;height:2px;background:#dbbd94;margin-bottom:25px;opacity:.2}
.rooms{display:grid;gap:8px}
.room{padding:14px 18px;background:#15181e;border:1px solid #ffffff0a;border-radius:12px;color:#ede8df;text-decoration:none;transition:.3s}
.room:hover{background:#dbbd9410;transform:translateX(4px)}
.icon{color:#dbbd94;margin-right:8px}.empty{color:#ffffff33}
</style>
</head>

<body>
<div class="container">

<div class="title">✦ <span>Chat</span> Rooms</div>
<div class="line"></div>

<div class="rooms">
{% for chatroom in chat_rooms %}
<a href="{% url 'chatroom' chatroom.slug %}" class="room">
    <span class="icon">✦</span>{{ chatroom.name }}
</a>
{% empty %}
<div class="empty">No rooms available</div>
{% endfor %}
</div>

</div>
</body>
</html>
