<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ chatroom.name }} - Chat</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:30px;background:#0d0e12;color:#ede8df;font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center}
.container,form,#message-list,.reconnect-btn{width:100%;max-width:500px}.back-link{align-self:flex-start;color:#777;text-decoration:none;margin-bottom:10px}
h2{margin:5px 0 10px}.status{padding:7px 14px;border-radius:8px;margin-bottom:15px;background:#181a20}.connected{color:#4caf50}.disconnected{color:#f44336}
form{background:#15181e;padding:18px;border-radius:14px}input,textarea{width:100%;padding:10px;margin-bottom:10px;background:#20232a;border:1px solid #333;border-radius:8px;color:#fff}button{width:100%;padding:10px;border:0;border-radius:8px;background:#dbbd94;cursor:pointer}button:disabled{opacity:.5}
#message-list{margin-top:20px;max-height:400px;overflow:auto}.msg-item{background:#15181e;padding:12px 15px;border-radius:12px;margin-bottom:8px}.msg-header{display:flex;justify-content:space-between}.msg-user{color:#dbbd94;font-weight:600}.msg-time{color:#777;font-size:11px}.msg-body{margin-top:6px;word-break:break-word}.reconnect-btn{margin-top:10px;background:#4caf50}
</style>
</head>

<body>

<div class="container">
<a href="{% url 'index' %}" class="back-link">← Back to rooms</a>
<h2>✦ {{ chatroom.name }}</h2>
<div id="status" class="status disconnected">🔴 Connecting...</div>

<form id="myForm">
<input id="username" placeholder="Username..." value="User1">
<textarea id="msg" placeholder="Type message..." required></textarea>
<button id="sendBtn" disabled>Send</button>
</form>

<button id="reconnectBtn" class="reconnect-btn">🔄 Reconnect</button>
<div id="message-list">
{% for msg in messages %}
<div class="msg-item">
<div class="msg-header">
<span class="msg-user">{{ msg.user.username }}</span>
<span class="msg-time">{{ msg.date|date:"H:i" }}</span>
</div>
<div class="msg-body">{{ msg.message_content }}</div>
</div>
{% empty %}
<div class="msg-item">💬 No messages yet.</div>
{% endfor %}
</div>
</div>

<script>
const room="{{ chatroom.slug }}",status=document.getElementById("status"),btn=document.getElementById("sendBtn"),list=document.getElementById("message-list"),form=document.getElementById("myForm"),msg=document.getElementById("msg"),user=document.getElementById("username");
let socket;

function connect(){
socket=new WebSocket(`ws://${location.host}/ws/${room}/`);

socket.onopen=()=>{status.textContent="🟢 Connected";status.className="status connected";btn.disabled=false};
socket.onmessage=e=>{let d=JSON.parse(e.data);addMessage(d.username||"Anonymous",d.message)};
socket.onclose=()=>{status.textContent="🔴 Disconnected";status.className="status disconnected";btn.disabled=true};
socket.onerror=()=>status.textContent="⚠️ Connection error";
}

function addMessage(username,message){
list.insertAdjacentHTML("beforeend",`<div class="msg-item"><div class="msg-header"><span class="msg-user">${username}</span><span class="msg-time">${new Date().toLocaleTimeString()}</span></div><div class="msg-body">${message}</div></div>`);
list.scrollTop=list.scrollHeight;
}

form.onsubmit=e=>{
e.preventDefault();
if(socket.readyState!==WebSocket.OPEN)return;
if(!msg.value.trim()||!user.value.trim())return;
socket.send(JSON.stringify({message:msg.value.trim(),username:user.value.trim(),room}));
msg.value="";msg.focus();
};

document.getElementById("reconnectBtn").onclick=connect;
connect();
</script>

</body>
</html>
