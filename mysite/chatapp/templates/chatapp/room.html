<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ chatroom.name }} - Chat</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{min-height:100vh;background:#0d0e12;font-family:system-ui,sans-serif;padding:40px 30px;display:flex;flex-direction:column;align-items:center}
        .back-link{color:rgba(255,255,255,0.3);text-decoration:none;font-size:14px;margin-bottom:10px;align-self:flex-start;max-width:400px;width:100%}
        .back-link:hover{color:#dbbd94}
        .chatroom-name{color:#ede8df;font-size:32px;font-weight:600;margin-bottom:10px}
        .chatroom-name span{color:#dbbd94}
        .status{color:#ede8df;font-size:14px;margin-bottom:15px;padding:8px 16px;border-radius:8px;background:rgba(255,255,255,0.05);cursor:pointer}
        .status.connected{color:#4caf50}
        .status.disconnected{color:#f44336}
        form{background:#15181e;padding:20px;border-radius:16px;max-width:400px;width:100%}
        input,textarea{width:100%;padding:10px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);border-radius:10px;color:#ede8df;margin-bottom:10px;font-family:inherit}
        button{width:100%;padding:10px;background:#dbbd94;border:none;border-radius:10px;color:#0d0e12;font-weight:600;cursor:pointer}
        button:disabled{opacity:.5;cursor:not-allowed}
        #message-list{max-width:400px;width:100%;margin-top:20px;max-height:300px;overflow-y:auto}
        .msg-item{background:rgba(255,255,255,0.05);padding:10px;border-radius:10px;margin-bottom:8px;color:#ede8df}
        .msg-item .msg-user{color:#dbbd94;font-weight:600}
        .msg-item .msg-time{color:rgba(255,255,255,0.3);font-size:11px;margin-left:10px}
        .reconnect-btn{background:#4caf50;margin-top:10px;max-width:400px;width:100%}
        .reconnect-btn:hover{background:#388e3c}
    </style>
</head>
<body>
    <a href="{% url 'index' %}" class="back-link">← Back to rooms</a>

    <div class="chatroom-name">✦ <span id="roomDisplay">{{ chatroom.name }}</span></div>

    <div id="status" class="status disconnected">🔴 Connecting...</div>

    <form id="myForm">
        <input type="text" id="username" placeholder="Username..." value="User1">
        <textarea id="msg" placeholder="Type message..." required></textarea>
        <button type="submit" id="sendBtn" disabled>Send</button>
    </form>
     <button id="reconnectBtn" class="reconnect-btn">🔄 Reconnect</button>

    <div id="message-list"></div>
    <style>
    #message-list {
        max-width: 500px;
        width: 100%;
        margin-top: 20px;
        max-height: 400px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding-right: 5px;
    }
    #message-list::-webkit-scrollbar {
        width: 4px;
    }
    #message-list::-webkit-scrollbar-track {
        background: rgba(255, 255, 255, 0.05);
        border-radius: 10px;
    }
    #message-list::-webkit-scrollbar-thumb {
        background: #dbbd94;
        border-radius: 10px;
    }
    .msg-item {
        background: #15181e;
        padding: 14px 18px;
        border-radius: 14px;
        border: 1px solid rgba(255, 255, 255, 0.04);
        transition: all 0.3s ease;
        animation: fadeIn 0.3s ease;
    }
    .msg-item:hover {
        background: rgba(255, 255, 255, 0.06);
        border-color: rgba(219, 189, 148, 0.15);
        transform: translateX(4px);
    }
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }
    .msg-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 6px;
    }
    .msg-user-wrapper {
        display: flex;
        align-items: center;
        gap: 10px;
    }
    .msg-avatar {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: #dbbd94;
        color: #0d0e12;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 14px;
        text-transform: uppercase;
    }
    .msg-user {
        color: #dbbd94;
        font-weight: 600;
        font-size: 14px;
    }
    .msg-time {
        color: rgba(255, 255, 255, 0.25);
        font-size: 11px;
    }
    .msg-body {
        color: #ede8df;
        font-size: 14px;
        word-wrap: break-word;
        padding-left: 42px;
        line-height: 1.5;
    }
    .empty-msg {
        color: rgba(255, 255, 255, 0.15);
        font-size: 14px;
        padding: 30px 0;
        text-align: center;
        background: rgba(255, 255, 255, 0.02);
        border-radius: 12px;
        border: 1px dashed rgba(255, 255, 255, 0.05);
    }
</style>

<div id="message-list">
    {% for msg in messages %}
        <div class="msg-item">
            <div class="msg-header">
                <div class="msg-user-wrapper">
                    <div class="msg-avatar">{{ msg.user.username|first }}</div>
                    <span class="msg-user">{{ msg.user.username }}</span>
                </div>
                <span class="msg-time">{{ msg.date|date:"H:i" }}</span>
            </div>
            <div class="msg-body">
                {{ msg.message_content }}
            </div>
        </div>
    {% empty %}
        <div class="empty-msg">💬 No messages yet. Start the conversation!</div>
    {% endfor %}
</div>
    <script>
        const roomName = "{{ chatroom.slug }}";
        let socket = null;
        let reconnectAttempts = 0;
        let isConnected = false;

        const roomDisplay = document.getElementById("roomDisplay");
        const statusDiv = document.getElementById("status");
        const sendBtn = document.getElementById("sendBtn");
        const messageList = document.getElementById("message-list");
        const form = document.getElementById("myForm");
        const msgInput = document.getElementById("msg");
        const usernameInput = document.getElementById("username");
        const reconnectBtn = document.getElementById("reconnectBtn");

        roomDisplay.textContent = roomName;

        function connectWebSocket() {
            const wsUrl = `ws://${window.location.host}/ws/${roomName}/`;

            try {
                socket = new WebSocket(wsUrl);

                socket.onopen = function() {
                    statusDiv.textContent = "🟢 Connected " ;
                    statusDiv.className = "status connected";
                    sendBtn.disabled = false;
                    reconnectAttempts = 0;
                    isConnected = true;
                    addMessage("System", `Welcome to ${roomName}!`, "system");
                };

                socket.onmessage = function(e) {
                    const data = JSON.parse(e.data);
                    addMessage(data.username || "Anonymous", data.message, data.room);
                };

                socket.onclose = function() {
                    statusDiv.textContent = "🔴 Disconnected from " + roomName;
                    statusDiv.className = "status disconnected";
                    sendBtn.disabled = true;
                    isConnected = false;

                    if (reconnectAttempts < 10) {
                        reconnectAttempts++;
                        setTimeout(connectWebSocket, 5000);
                    }
                };

                socket.onerror = function() {
                    statusDiv.textContent = "⚠️ Error connecting to " + roomName;
                    statusDiv.className = "status disconnected";
                    sendBtn.disabled = true;
                    isConnected = false;
                };

            } catch (error) {
                statusDiv.textContent = "⚠️ Connection failed";
                statusDiv.className = "status disconnected";
                sendBtn.disabled = true;
                isConnected = false;
            }
        }

        function addMessage(username, message, room) {
            const msgDiv = document.createElement("div");
            msgDiv.className = "msg-item";
            const time = new Date().toLocaleTimeString("en-US");
            const isSystem = username === "System" || username === "system";
            msgDiv.innerHTML = `
                <span class="msg-user">${isSystem ? "🤖 System" : username}</span>
                <span class="msg-time">${time}</span>
                <br><span>${message}</span>
            `;
            messageList.appendChild(msgDiv);
            messageList.scrollTop = messageList.scrollHeight;
        }

        function sendMessage() {
            if (!socket || socket.readyState !== WebSocket.OPEN) {
                alert("Not connected!");
                return;
            }

            const message = msgInput.value.trim();
            const username = usernameInput.value.trim();

            if (!message || !username) {
                alert("Fill all fields!");
                return;
            }

            socket.send(JSON.stringify({ message, username, room: roomName }));
            msgInput.value = "";
            msgInput.focus();
        }

        function forceReconnect() {
            if (socket) {
                try { socket.close(); } catch(e) {}
                socket = null;
            }
            reconnectAttempts = 0;
            statusDiv.textContent = "🔄 Reconnecting...";
            statusDiv.className = "status disconnected";
            sendBtn.disabled = true;
            isConnected = false;
            connectWebSocket();
        }

        form.addEventListener("submit", function(e) {
            e.preventDefault();
            sendMessage();
        });

        msgInput.addEventListener("keydown", function(e) {
            if (e.key === "Enter" && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        statusDiv.addEventListener("click", forceReconnect);
        reconnectBtn.addEventListener("click", forceReconnect);

        connectWebSocket();
    </script>
</body>
</html>
