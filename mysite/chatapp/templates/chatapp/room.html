<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Send Message</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            background: #0d0e12;
            font-family: system-ui, sans-serif;
            padding: 40px 30px;
        }
        .chatroom-name {
            color: #ede8df;
            font-size: 28px;
            font-weight: 600;
            letter-spacing: 0.5px;
            margin-bottom: 30px;
        }
        .chatroom-name span {
            color: #dbbd94;
        }
        form {
            background: #15181e;
            padding: 20px 22px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            max-width: 360px;
            width: 100%;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5);
        }
        form h4 {
            color: #ede8df;
            font-weight: 400;
            font-size: 14px;
            margin-bottom: 12px;
        }
        form h4 span {
            color: #dbbd94;
            font-weight: 600;
        }
        textarea {
            width: 100%;
            padding: 10px 12px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            color: #ede8df;
            font-size: 13px;
            font-family: inherit;
            outline: none;
            resize: vertical;
            min-height: 60px;
            transition: 0.3s;
        }
        textarea:focus {
            border-color: rgba(219, 189, 148, 0.3);
            background: rgba(255, 255, 255, 0.06);
        }
        textarea::placeholder {
            color: rgba(255, 255, 255, 0.15);
        }
        button {
            width: 100%;
            margin-top: 10px;
            padding: 10px;
            background: #dbbd94;
            border: none;
            border-radius: 10px;
            color: #0d0e12;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover {
            background: #c9a87e;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(219, 189, 148, 0.15);
        }
    </style>
</head>
<body>

    <div class="chatroom-name">✦ <span>{{chatroom.name}}</span></div>

    <form id="myForm">
        <h4>✦ <span>Send</span> Message</h4>
        <textarea id="msg" placeholder="Type your message..." required></textarea>
        <button type="submit">✦ Send</button>
    </form>

    <script>
        document.getElementById('myForm').onsubmit = function(e) {
            e.preventDefault();
            let txt = document.getElementById('msg').value.trim();
            if (txt) {
                alert('✅ Message sent:\n\n' + txt);
                this.reset();
            } else {
                alert('❌ Please enter a message.');
            }
        };
    </script>

</body>
</html>
